name: Verify Lyra
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: python3 -m venv lyra-backend/.venv
      - run: lyra-backend/.venv/bin/python -m pip install -r lyra-backend/requirements.txt
      - run: npm test
      - run: npm run build
